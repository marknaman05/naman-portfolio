<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naman Markhedkar — Still building.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&family=Schibsted+Grotesk:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;--graphite:#16181b;--paper:#e9e6df;--dim:#77746d;
  --sodium:#ffb547;--steel:#9fb4c7;--day:#efe2cc;--clay:#c79a6b;--soil:#1d1712;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#e9e6df}}
:root[data-theme="dark"]{--paper:#e9e6df}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:#000;color:var(--paper);overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased}
#film{position:relative;width:100%;height:100%;overflow:hidden;background:var(--black);transition:background 3.5s ease,color 2s ease}
#film.warm{background:radial-gradient(120% 90% at 72% 18%,#4a3521 0%,#1c140c 55%,#0a0705 100%)}
#film.dawn{background:linear-gradient(180deg,#f3e8d4 0%,#e3cda9 58%,#c4a37b 100%);color:var(--soil)}
#stage{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .9s ease}
.scene.on{opacity:1}
.bar{position:absolute;left:0;right:0;height:7.5vh;background:#000;z-index:5;pointer-events:none}
.bar.t{top:0}.bar.b{bottom:0}
@media (max-aspect-ratio:1/1){.bar{height:4vh}}
.grain{position:absolute;inset:-50%;z-index:4;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .6s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
.vig{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}

#cap{position:absolute;left:50%;bottom:calc(7.5vh + 1.6rem);transform:translateX(-50%);width:min(88%,52rem);text-align:center;
  font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.2rem,2.9vw,2.2rem);line-height:1.3;z-index:6;
  opacity:0;transition:opacity .7s ease;text-wrap:balance;text-shadow:0 1px 18px rgba(0,0,0,.6)}
#cap.on{opacity:1}
#film.dawn #cap{text-shadow:none;color:var(--soil)}
#film.nocc #cap{display:none}

/* terminal */
.term{font-family:var(--mono);font-size:clamp(1rem,2.6vw,1.7rem);line-height:1.8;min-width:min(80vw,26ch)}
.term .p{color:var(--dim)}
.cursor{display:inline-block;width:.58em;height:1.08em;background:var(--sodium);vertical-align:-.17em;margin-left:.08em;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* flashes */
.shot{font-family:var(--mono);font-size:clamp(1rem,3.4vw,2.4rem);white-space:pre;animation:push 1.2s ease-out forwards}
@keyframes push{from{transform:scale(1.14)}to{transform:scale(1)}}
.shot.ok{color:var(--sodium)}
.note{width:min(70vw,34rem);aspect-ratio:3/2;background:#d9d3c5;color:#26221c;display:grid;place-items:center;
  background-image:linear-gradient(#b9b1a1 1px,transparent 1px),linear-gradient(90deg,#b9b1a1 1px,transparent 1px);background-size:22px 22px;
  font-family:var(--serif);font-style:italic;font-size:clamp(2rem,7vw,4.5rem);animation:push 1.2s ease-out forwards}
.city{display:grid;grid-template-columns:repeat(28,1fr);gap:5px;width:min(84vw,56rem)}
.city i{aspect-ratio:1/1.6;background:#15171a}
.city i.l{background:var(--sodium);opacity:.75}

/* titles */
.title{font-family:var(--sans);font-weight:900;letter-spacing:-.045em;font-size:clamp(3.2rem,14vw,12rem);line-height:.84;text-align:center;text-transform:uppercase}
.title span{display:inline-block;opacity:0;transform:translateY(.12em);transition:opacity .7s ease,transform 1.1s cubic-bezier(.2,.7,.1,1)}
.title span.in{opacity:1;transform:none}
.sub{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.4rem,3.6vw,2.6rem);opacity:0;transition:opacity 1.4s ease;margin-top:1.4rem;text-align:center}
.sub.in{opacity:1}
.label{font-family:var(--sans);font-weight:800;letter-spacing:.02em;font-size:clamp(2.4rem,9vw,7rem);line-height:.9;text-align:center}
.small{font-family:var(--mono);font-size:clamp(.8rem,1.6vw,1.05rem);color:var(--dim);text-align:center;margin-top:1rem;letter-spacing:.04em}

/* light */
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 30px 10px rgba(255,200,120,.45),0 0 120px 40px rgba(255,181,71,.15)}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-8vw,2vh)}to{transform:translate(8vw,-3vh)}}

/* code */
.code-wrap{position:absolute;inset:0;overflow:hidden;mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
.code-scroll{font-family:var(--mono);font-size:clamp(.8rem,1.6vw,1.1rem);line-height:1.9;white-space:pre;color:#5d6167;padding:0 8vw;animation:scroll 14s linear forwards}
.code-scroll .k{color:var(--steel)}.code-scroll .s{color:#b7a98f}.code-scroll .c{color:#3e4146}.code-scroll .h{color:var(--paper)}
@keyframes scroll{from{transform:translateY(10vh)}to{transform:translateY(-60%)}}

/* flow */
.flow{display:flex;align-items:center;gap:clamp(.4rem,1.6vw,1.2rem);flex-wrap:wrap;justify-content:center;padding:0 5vw}
.flow.v{flex-direction:column;gap:.35rem}
.node{font-family:var(--mono);font-size:clamp(.78rem,1.6vw,1.05rem);padding:.7em 1.1em;border:1px solid #2a2d31;color:#555;transition:all .45s ease;background:#07080a}
.node.lit{border-color:var(--sodium);color:var(--paper);box-shadow:0 0 30px -6px rgba(255,181,71,.45)}
.arr{width:clamp(1rem,4vw,3rem);height:1px;background:#2a2d31;position:relative;overflow:hidden}
.flow.v .arr{width:1px;height:1.1rem}
.arr::after{content:"";position:absolute;inset:0;background:var(--sodium);transform:scaleX(0);transform-origin:left;transition:transform .4s ease}
.flow.v .arr::after{transform:scaleY(0);transform-origin:top}
.arr.lit::after{transform:none}

.card{width:min(78vw,26rem);border:1px dashed #3a3d42;padding:1.6rem;font-family:var(--sans);transition:all .8s ease}
.card .ln{height:.7rem;background:#1d1f23;margin:.7rem 0;border-radius:2px}
.card .btn{margin-top:1.4rem;display:inline-block;font-family:var(--mono);font-size:.95rem;padding:.6em 1.2em;border:1px solid #3a3d42;color:var(--dim);transition:all .4s}
.card.solid{border-style:solid;border-color:#55595f}
.card.solid .btn{background:var(--paper);color:#000;border-color:var(--paper)}
.card .st{font-family:var(--mono);font-size:.95rem;color:var(--sodium);margin-top:1rem;opacity:0;transition:opacity .4s}
.card.solid .st{opacity:1}

svg.mesh{position:absolute;inset:0;width:100%;height:100%}
.edge{stroke:var(--steel);stroke-opacity:.14;stroke-width:1}
.edge.f{stroke:var(--sodium);stroke-opacity:.6;stroke-dasharray:3 60;animation:fl 2.4s linear infinite}
@keyframes fl{to{stroke-dashoffset:-63}}
.vx{fill:#0b0c0e;stroke:var(--steel);stroke-opacity:.5}
.vx.p{animation:vp 2s ease-in-out infinite}
@keyframes vp{50%{stroke:var(--sodium);stroke-opacity:1}}

.mon{width:min(70vw,44rem);aspect-ratio:16/10;border:1px solid #3a3d42;border-radius:6px;display:grid;place-items:center;position:relative;
  font-family:var(--mono);font-size:clamp(.9rem,2.2vw,1.4rem);background:#060708;transition:width .6s cubic-bezier(.2,.7,.1,1)}
.mon::after{content:"";position:absolute;left:40%;right:40%;bottom:-1.4rem;height:1.4rem;border:1px solid #3a3d42;border-top:0}
.mon .yr{position:absolute;right:1rem;bottom:.8rem;color:var(--dim);font-size:.75em}
.eq{position:absolute;font-family:var(--serif);font-style:italic;color:#8d8778;font-size:clamp(1.1rem,2.6vw,2rem);animation:float 12s linear forwards;opacity:.65}
@keyframes float{from{transform:translateY(4vh)}to{transform:translateY(-10vh)}}

.flash{font-family:var(--sans);font-weight:900;font-size:clamp(4rem,20vw,16rem);letter-spacing:-.05em}

.agent{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(1.4rem,4vw,4rem);align-items:center;width:min(92vw,62rem)}
@media (max-width:640px){.agent{grid-template-columns:1fr}.agent .flow.v{flex-direction:row;flex-wrap:wrap}.agent .flow.v .arr{display:none}}
.log{font-family:var(--mono);font-size:clamp(.75rem,1.5vw,.98rem);line-height:1.85;color:#8e8b84;min-height:14em;overflow-wrap:anywhere}
.log div{opacity:0;animation:li .35s ease forwards}
@keyframes li{to{opacity:1}}
.log .u{color:var(--paper)}.log .t{color:var(--steel)}.log .r{color:var(--sodium)}

.hk{text-align:center}
.hk .hr{font-family:var(--mono);font-size:clamp(.85rem,1.8vw,1.1rem);color:var(--dim);letter-spacing:.06em}
.hk .ev{font-family:var(--serif);font-style:italic;font-size:clamp(1.8rem,5vw,3.6rem);margin-top:.6rem}
.hk .bad{color:#e0715e;font-family:var(--mono);font-style:normal;font-size:.55em}
.hk .good{color:var(--sodium);font-family:var(--mono);font-style:normal;font-size:.55em}

.sun{position:absolute;width:48vmin;height:48vmin;border-radius:50%;right:12vw;top:14vh;background:radial-gradient(circle,rgba(255,244,220,.95),rgba(255,214,150,.2) 55%,transparent 70%);animation:rise 12s ease-out forwards}
@keyframes rise{from{transform:translateY(18vh);opacity:.3}to{transform:none;opacity:1}}
.runs{width:min(80vw,46rem);display:flex;flex-direction:column;gap:clamp(.55rem,1.4vh,1rem)}
.run{height:3px;background:var(--soil);width:0;transition:width 1.1s cubic-bezier(.3,.6,.2,1)}

.tl{width:min(88vw,52rem);font-family:var(--mono);font-size:.78rem;color:var(--dim);position:relative}
.trk{display:flex;align-items:center;gap:.8rem;height:2.6rem;border-bottom:1px solid #2b241c}
.trk b{width:2.2rem;font-weight:400}
.lane{flex:1;position:relative;height:1.7rem}
.clip{position:absolute;top:0;bottom:0;background:#6d5238;border:1px solid #a2805c;border-radius:2px}
.clip.a{background:#2f3c33;border-color:#57705e}
.wave{position:absolute;inset:0;display:flex;align-items:center;gap:2px}
.wave i{flex:1;background:#8fb39a;opacity:.8}
.ph{position:absolute;top:-.6rem;bottom:0;width:2px;background:var(--sodium);left:3.2rem;animation:ph 6s linear forwards}
@keyframes ph{to{left:100%}}
.ap{width:min(40vmin,16rem);aspect-ratio:1;transition:transform .15s}

.win{width:min(56vmin,24rem);aspect-ratio:3/4;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;background:#2b1f14;box-shadow:0 0 140px 30px rgba(255,210,150,.18)}
.win i{background:linear-gradient(160deg,#fbe9c9,#e4bf8a);opacity:.9;animation:breathe 6s ease-in-out infinite alternate}
@keyframes breathe{to{opacity:.7}}
.beam{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,220,170,.08) 45%,transparent 60%);animation:sway 10s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateX(6vw)}}

.frag{position:absolute;font-family:var(--mono);font-size:clamp(.9rem,2vw,1.35rem);color:var(--paper);opacity:0;transition:opacity .6s}
.frag.in{opacity:.8}

.roles{margin-top:1.6rem;display:flex;flex-direction:column;align-items:center;gap:.35rem;font-family:var(--sans);font-weight:500;font-size:clamp(.85rem,1.8vw,1.1rem);letter-spacing:.2em;color:var(--dim)}
.roles span{opacity:0;transition:opacity 1s}.roles span.in{opacity:1}
.url{font-family:var(--mono);font-size:clamp(1rem,2.4vw,1.5rem);margin-top:2rem;opacity:0;transition:opacity 1.2s}
.url.in{opacity:1}

/* chrome */
#gate{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#000;transition:opacity 1s}
#gate.gone{opacity:0;pointer-events:none}
.gate-in{text-align:center;padding:2rem}
.gate-in h1{font-family:var(--sans);font-weight:900;letter-spacing:-.04em;font-size:clamp(2.2rem,7vw,4.5rem);margin:0;line-height:.95}
.gate-in p{font-family:var(--serif);font-style:italic;font-weight:300;color:var(--dim);font-size:clamp(1rem,2.2vw,1.3rem);margin:1rem 0 2.2rem}
button{font:inherit;cursor:pointer}
.play{font-family:var(--mono);font-size:1rem;background:var(--paper);color:#000;border:0;padding:1em 1.8em;border-radius:999px}
.play:focus-visible,.ctl button:focus-visible{outline:2px solid var(--sodium);outline-offset:3px}
.ctl{position:absolute;top:calc(7.5vh + .8rem);right:1rem;z-index:9;display:flex;gap:.4rem;opacity:.35;transition:opacity .3s}
.ctl:hover,.ctl:focus-within{opacity:1}
.ctl button{font-family:var(--mono);font-size:.75rem;background:rgba(0,0,0,.5);color:#ddd;border:1px solid #444;padding:.45em .8em;border-radius:4px}
.ctl button[aria-pressed="false"]{opacity:.5}
@media (max-aspect-ratio:1/1){.ctl{top:calc(4vh + .6rem)}}
</style>
</head>
<body>
<div id="film">
  <div id="stage"></div>
  <div class="vig"></div>
  <div class="grain"></div>
  <div class="bar t"></div><div class="bar b"></div>
  <div id="cap" aria-live="polite"></div>
  <div class="ctl" hidden>
    <button id="bCC" aria-pressed="true">Captions</button>
    <button id="bSnd" aria-pressed="true">Sound</button>
    <button id="bRe">Replay</button>
  </div>
  <div id="gate">
    <div class="gate-in">
      <h1>Still building.</h1>
      <p>A short film about Naman Markhedkar. About two and a half minutes. Sound on.</p>
      <button class="play" id="bPlay">Play the film</button>
    </div>
  </div>
</div>

<script>
/* ---------- utilities ---------- */
const film=document.getElementById('film'),stage=document.getElementById('stage'),cap=document.getElementById('cap');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let timers=[],intervals=[],current=null,muted=false;
const later=(ms,f)=>{const id=setTimeout(f,ms);timers.push(id);return id};
const every=(ms,f)=>{const id=setInterval(f,ms);intervals.push(id);return id};
const at=(s,f)=>later(s*1000,f);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const rnd=(a,b)=>a+Math.random()*(b-a);
function scene(html,cls=''){const s=el(`<div class="scene ${cls}">${html}</div>`);stage.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('on')));
  if(current){const o=current;o.classList.remove('on');later(1000,()=>o.remove())}current=s;return s}
function cut(html,cls=''){stage.innerHTML='';const s=el(`<div class="scene on ${cls}" style="transition:none">${html}</div>`);stage.appendChild(s);current=s;return s}
function fadeOut(){if(current){const o=current;o.classList.remove('on');later(1000,()=>o.remove());current=null}}
function blackNow(){stage.innerHTML='';current=null}
function say(text,dur){cap.textContent=text;cap.classList.add('on');later(dur*1000,()=>{if(cap.textContent===text)cap.classList.remove('on')})}
function type(node,text,cps=13,snd=true){return new Promise(res=>{let i=0;const step=()=>{if(i>=text.length)return res();
  node.textContent+=text[i++];if(snd&&text[i-1]!==' ')A.key();later(1000/cps*rnd(.55,1.45),step)};step()})}
function spanify(t){return [...t].map(c=>`<span>${c===' '?'&nbsp;':c}</span>`).join('')}
function reveal(root,stagger=45){root.querySelectorAll('span').forEach((s,i)=>later(i*stagger,()=>s.classList.add('in')))}

/* ---------- sound (all synthesized, no files) ---------- */
const A={ac:null,m:null,nb:null,dg:null,dosc:[],pad:[],
init(){const ac=this.ac=new (window.AudioContext||window.webkitAudioContext)();
  this.m=ac.createGain();this.m.gain.value=.85;this.m.connect(ac.destination);
  const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;
  this.dg=ac.createGain();this.dg.gain.value=0;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.connect(this.dg);this.dg.connect(this.m);
  [55,55.35,82.5].forEach(f=>{const o=ac.createOscillator();o.frequency.value=f;o.connect(lp);o.start();this.dosc.push(o)});},
now(){return this.ac.currentTime},
drone(v,s=2){if(!this.ac)return;const g=this.dg.gain;g.cancelScheduledValues(this.now());g.setValueAtTime(g.value,this.now());g.linearRampToValueAtTime(v,this.now()+s)},
droneF(f,s=3){if(!this.ac)return;[1,1.0064,1.5].forEach((r,i)=>this.dosc[i].frequency.linearRampToValueAtTime(f*r,this.now()+s))},
noise(dur,type,freq,q,vol,att=.002){if(!this.ac)return;const ac=this.ac,s=ac.createBufferSource();s.buffer=this.nb;
  const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=ac.createGain(),t=this.now();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(this.m);s.start(t,Math.random());s.stop(t+dur+.05);return f},
tone(f,dur,vol,type='sine',att=.005){if(!this.ac)return;const ac=this.ac,o=ac.createOscillator(),g=ac.createGain(),t=this.now();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(this.m);o.start(t);o.stop(t+dur+.05);return o},
key(){this.noise(.035,'highpass',rnd(2500,4200),.8,rnd(.06,.13))},
thump(f=58,v=.35){const o=this.tone(f*2.2,.35,v);if(o)o.frequency.exponentialRampToValueAtTime(f,this.now()+.12)},
hit(){this.tone(98,5,.28);this.tone(196,4,.1,'triangle');this.tone(293.7,3.5,.04);this.noise(1.2,'lowpass',500,.5,.08)},
whoosh(){const f=this.noise(.9,'bandpass',300,1.2,.12,.35);if(f)f.frequency.exponentialRampToValueAtTime(3200,this.now()+.8)},
shutter(){this.noise(.03,'highpass',1800,.7,.35);later(70,()=>this.noise(.05,'bandpass',1200,1,.3))},
step(){this.thump(70,.22);this.noise(.07,'lowpass',900,.5,.08)},
breath(){this.noise(.9,'bandpass',rnd(800,1100),.9,.035,.45)},
blip(f=880){this.tone(f,.12,.05,'sine',.003)},
padOn(fs,v=.03){if(!this.ac)return;this.padOff();fs.forEach(f=>{const o=this.ac.createOscillator(),g=this.ac.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.value=0;g.gain.linearRampToValueAtTime(v,this.now()+4);o.connect(g);g.connect(this.m);o.start();this.pad.push([o,g])})},
padOff(s=2.5){if(!this.ac)return;this.pad.forEach(([o,g])=>{g.gain.cancelScheduledValues(this.now());g.gain.setValueAtTime(g.gain.value,this.now());g.gain.linearRampToValueAtTime(0,this.now()+s);o.stop(this.now()+s+.1)});this.pad=[]}
};
let pulseId=null;
function pulse(ms,f=52,v=.3){if(pulseId)clearInterval(pulseId);pulseId=every(ms,()=>A.thump(f,v))}
function pulseOff(){if(pulseId)clearInterval(pulseId);pulseId=null}

/* ---------- visual builders ---------- */
function termLine(prompt=true){return `<div class="line">${prompt?'<span class="p">$ </span>':''}<span class="t"></span><span class="cursor"></span></div>`}

const flashes=[
 ()=>`<pre class="shot">public class Builder {\n    void ship() { … }\n}</pre>`,
 ()=>`<div class="shot">$ git commit -m "first try"</div>`,
 ()=>`<div class="shot ok">HTTP/1.1 200 OK</div>`,
 ()=>`<svg width="70%" viewBox="0 0 400 140" style="max-width:40rem"><polyline fill="none" stroke="#9fb4c7" stroke-width="2" points="0,120 40,110 80,114 120,90 160,96 200,70 240,76 280,48 320,52 360,26 400,18"/></svg>`,
 ()=>`<div class="note">∂ψ/∂t</div>`,

function flow(labels,vertical=false){return `<div class="flow${vertical?' v':''}">`+labels.map((l,i)=>(i?'<div class="arr"></div>':'')+`<div class="node">${l}</div>`).join('')+'</div>'}
function lightFlow(root,gap=650,snd=true){const n=[...root.querySelectorAll('.node')],a=[...root.querySelectorAll('.arr')];

function mesh(){const W=1000,H=560,pts=Array.from({length:22},()=>[rnd(60,W-60),rnd(70,H-70)]);let e='';
  pts.forEach((p,i)=>pts.forEach((q,j)=>{if(j>i&&Math.hypot(p[0]-q[0],p[1]-q[1])<230)e+=`<line class="edge${Math.random()<.35?' f':''}" x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"/>`}));
  return `<svg class="mesh" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${e}${pts.map(p=>`<circle class="vx${Math.random()<.4?' p':''}" cx="${p[0]}" cy="${p[1]}" r="${rnd(4,9)}" style="animation-delay:${rnd(0,2)}s"/>`).join('')}</svg>`}
